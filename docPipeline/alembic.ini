[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally not set here — alembic/env.py sets it at
# runtime from docsign.config.DATABASE_URL (DOCSIGN_DATABASE_URL, or the
# sqlite:///docsign.db default), the same place every other DB access in
# the app reads it from, so there is exactly one source of truth.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
