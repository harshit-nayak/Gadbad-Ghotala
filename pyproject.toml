[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docsign"
version = "0.1.0"
description = "Internal document signing and verification (authenticity + integrity only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
web = ["flask>=3"]
db = ["sqlalchemy>=2", "alembic>=1.13"]

[project.scripts]
docsign = "docsign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
